services:
  pricetrack:
    build: .
    # or: image: ghcr.io/this-will-be-your-username/pricetrack:latest
    ports:
      - "8080:8080"
    volumes:
      - pricetrack-data:/data
    environment:
      REFRESH_INTERVAL: 6h
      # AUTH_USER: me
      # AUTH_PASS: change-me
    restart: unless-stopped

volumes:
  pricetrack-data:
